name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps, what you expected, what happened." }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device and browser, placeholder: "Pixel 8, Chrome 130" }
  - type: input
    id: at
    attributes: { label: Assistive technology, placeholder: "TalkBack, VoiceOver, NVDA, Orca, braille display, none" }
  - type: textarea
    id: log
    attributes: { label: Error log, description: "Optional. Copy it from the app's Error log section. Remove anything private." }

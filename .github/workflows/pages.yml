name: Deploy staging to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: d
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - name: Smoke, axe and zero-external-request test against the live site
        run: node tests/e2e.mjs
        env: { BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/", CHROME_PATH: /usr/bin/google-chrome }

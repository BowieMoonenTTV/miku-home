name: Desktop release (Tauri)
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      tag: { description: "Existing release tag to upload to", required: true, default: "v0.1.0-beta" }
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-latest, args: "--bundles nsis" }
          - { platform: macos-latest, args: "--target universal-apple-darwin" }
          - { platform: ubuntu-22.04, args: "--bundles appimage" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: desktop
      # Unsigned builds: no Apple or Windows signing certificates (paid) are set up.
      # MSI and RPM reject the -beta version, so Windows ships NSIS and Linux ships AppImage (.deb is built locally).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Miku Home ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
